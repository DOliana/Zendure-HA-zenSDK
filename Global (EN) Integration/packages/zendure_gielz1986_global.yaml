      - name: "Zendure PV Passthrough"
        value_template: >
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (solar > 0) or (grid_off < 0) %}
          {% set states = {0: "Battery", 2: "Home"} %}
          {% set packState = value_json['properties']['pass'] | int %}
          {{ states.get(packState, "Unknown") if pv_active else "PV Offline" }}
        unique_id: zendure_pv_passthrough
        icon: mdi:arrow-decision

      - name: "Zendure Power PV To Home"
        value_template: >
          {% set pv = value_json['properties']['pvStatus'] | int(0) %}
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (pv == 1) or (solar > 0) or (grid_off < 0) %}
          {% set home = value_json['properties']['outputHomePower'] | float(0) %}
          {% set pack_in = value_json['properties']['packInputPower'] | float(0) %}
          {{ (home - pack_in) | round(1) if pv_active else 0 }}
        unique_id: zendure_power_pv_to_home
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure Power PV Total"
        value_template: >
          {% set pv = value_json['properties']['pvStatus'] | int(0) %}
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (pv == 1) or (solar > 0) or (grid_off < 0) %}
          {{ (solar + (0 - grid_off if grid_off < 0 else 0)) if pv_active else 0 }}
        unique_id: zendure_power_pv_total
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure Power PV To Battery"
        value_template: >
          {% set pv = value_json['properties']['pvStatus'] | int(0) %}
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (pv == 1) or (solar > 0) or (grid_off < 0) %}
          {% set pack = value_json['properties']['outputPackPower'] | float(0) %}
          {% set grid = value_json['properties']['gridInputPower'] | float(0) %}
          {{ (pack - grid) | round(1) if pv_active else 0 }}
        unique_id: zendure_power_pv_to_battery
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure Power From Home"
        value_template: >
          {% set grid_in = value_json['properties']['gridInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {{ (grid_in - (grid_off if grid_off > 0 else 0)) | round(1) }}
        unique_id: zendure_power_from_home
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure Power To Home"
        value_template: >
          {% set pack_out = value_json['properties']['packInputPower'] | float(0) %}
          {{ pack_out | round(1) }}
        unique_id: zendure_power_to_home
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure Power Offgrid Outlet 1"
        value_template: "{{ value_json.get('properties', {}).get('gridOffPower', 0) | int }}"
        unique_id: zendure_power_offgrid_outlet_1
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power
        icon: mdi:power-plug

      - name: "Zendure Offgrid Mode"
        value_template: >
          {% set states = {0: "Normal", 1: "Eco", 2: "Turned Off"} %}
          {% set packState = value_json.get('properties', {}).get('gridOffMode', 2) | int %}
          {{ states.get(packState, "Unknown") }}
        unique_id: zendure_offgrid_mode
        icon: >
         {% if this.state == 'Normal' %}
          mdi:power-plug
         {% elif this.state == 'Eco' %}
          mdi:power-plug
         {% elif this.state == 'Turned Off' %}
          mdi:power-plug-off
         {% else %}
          mdi:power-plug-outline
         {% endif %}

      - name: "Zendure Product Model"
        unique_id: zendure_product_model
        value_template: "{{ value_json.product }}"
        icon: mdi:identifier

      - name: "Zendure Total Capacity"
        unique_id: zendure_total_capacity
        unit_of_measurement: "kWh"
        icon: mdi:flip-vertical
        value_template: >
          {% set product = value_json.product %}
          {% if product in ["solarFlow4000MixAC+", "solarFlow4000MixPro", "solarFlow3000MixAC+"] %}
            {% set mapping = {
              70: 8.00
            } %}
          {% else %}
            {% set mapping = {
              5: 2.88,
              70: 1.92,
              300: 1.92,
              250: 0.96,
              350: 2.88,
              500: 2.40
            } %}
          {% endif %}
          {% set packs = value_json.packData %}
          {% if packs %}
            {% set ns = namespace(total=0) %}
            {% for pack in packs %}
              {% set type = pack.packType | int %}
              {% if type in mapping %}
                {% set ns.total = ns.total + mapping[type] %}
              {% endif %}
            {% endfor %}
            {{ ns.total | round(2) }}
          {% else %}
            0
          {% endif %}

      - name: "Zendure Inverter Max. Charge Power"
        value_template: "{{ value_json['properties']['chargeMaxLimit'] }}"
        unique_id: zendure_inverter_max_charge_power
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure Inverter Max. Discharge Power"
        value_template: "{{ value_json['properties']['inverseMaxPower'] }}"
        unique_id: zendure_inverter_max_discharge_power
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power

      - name: "Zendure SOC-limit Status"
        value_template: >
          {% set states = {0: "Normal Operation", 1: "Charging Limit Reached", 2: "Discharge Limit Reached", 16: "Normal Operation", 17: "Charging Limit Reached", 18: "Discharge Limit Reached"} %}
          {% set packState = value_json['properties']['socLimit'] | int %}
          {{ states.get(packState, "Unknown") }}
        unique_id: zendure_soc_limit_status
        icon: >
         {% if this.state == 'Normal Operation' %}
          mdi:battery-medium
         {% elif this.state == 'Charging Limit Reached' %}
          mdi:battery-high
         {% elif this.state == 'Discharge Limit Reached' %}
          mdi:battery-low
         {% else %}
          mdi:battery-outline
         {% endif %}
          
      - name: "Zendure Battery Serial Numbers"
        value_template: >
          {% set raw_order = states('input_text.zendure_setting_battery_order') %}
          {% set packdata = value_json.get('packData', []) %}
          {% set ns = namespace(sn_list=[]) %}
          {% if not packdata %}
            unknown
          {% elif raw_order in ['unknown', 'unavailable', ''] %}
            {% for pack in packdata %}
