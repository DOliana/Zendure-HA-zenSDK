input_datetime:
  zendure_gielz_automation_last_time_executed:
    name: Zendure Gielz Automation Last Time Executed
    icon: mdi:clock-time-eight-outline
    has_date: true
    has_time: true

sensor:
  - platform: history_stats
    name: "Home Energy Zero Import Duration Today"
    unique_id: home_energy_zero_import_duration_today
    entity_id: binary_sensor.home_energy_zero_import_active
    state: "on"
    type: time
    start: "{{ today_at() if now() < today_at('23:59') else now() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Zendure Relay Switches Charging Today"
    unique_id: zendure_relay_switches_charging_today
    entity_id: sensor.zendure_charging_mode
    state: "Charging"
    type: count
    start: "{{ today_at() if now() < today_at('23:59') else now() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "Zendure Relay Switches Discharging Today"
    unique_id: zendure_relay_switches_discharging_today
    entity_id: sensor.zendure_charging_mode
    state: "Discharging"
    type: count
    start: "{{ today_at() if now() < today_at('23:59') else now() }}"
    end: "{{ now() }}"

  - platform: statistics
    name: "Zendure Import Efficiency 24h"
    unique_id: zendure_import_efficiency_24h
    entity_id: sensor.zendure_import_efficiency
    state_characteristic: mean
    sampling_size: 86400
    max_age:
      hours: 24

  - platform: statistics
    name: "Zendure Export Efficiency 24h"
    unique_id: zendure_export_efficiency_24h
    entity_id: sensor.zendure_export_efficiency
    state_characteristic: mean
    sampling_size: 86400
    max_age:
      hours: 24

  - platform: integration
    name: "Zendure PV Import"
    unique_id: zendure_pv_import
    source: sensor.zendure_power_pv_total
    unit_prefix: k
    round: 2
    method: trapezoidal

  - platform: integration
    name: "Zendure Energy Import"
    unique_id: zendure_energy_import
    source: sensor.zendure_power_import
    unit_prefix: k
    round: 2
    method: trapezoidal

  - platform: integration
    name: "Zendure Energy Export"
    unique_id: zendure_energy_export
    source: sensor.zendure_power_export
    unit_prefix: k
    round: 2
    method: trapezoidal

  - platform: rest
    name: "GitHub Zendure Gielz1986"
    unique_id: github_zendure_gielz1986
    resource: "https://api.github.com/repos/Gielz1986/Zendure-HA-zenSDK/releases/latest"
    headers:
      User-Agent: "HomeAssistant"
    scan_interval: 3600
    json_attributes:
      - tag_name
      - name
      - published_at
      - body
    value_template: "{{ value_json.name }}"
    icon: mdi:github

utility_meter:
  zendure_pv_import_daily:
    source: sensor.zendure_pv_import
    unique_id: utility_meter.zendure_pv_import_daily
    name: Zendure PV Import Daily
    cycle: daily

template:
  - binary_sensor:
      - name: "Zendure Automatic Discharge Allowed"
        unique_id: zendure_automatic_discharge_allowed
        state: >
          {{ states('sensor.zendure_total_state_of_charge') | float(0) >
             [states('sensor.zendure_minimum_state_of_charge') | float(0),
              states('input_number.zendure_setting_soft_discharge_state_of_charge') | float(5)] | max }}

      - name: "Home Energy Zero Import Active"
        unique_id: home_energy_zero_import_active
        device_class: power
        state: "{{ states('sensor.home_energy_meter_power') | float(0) < 1 }}"
        icon: >
          {% if states('sensor.home_energy_meter_power') | float(0) < 1 %}
            mdi:leaf
          {% else %}
            mdi:flash
          {% endif %}

  - trigger:
      - platform: state
        entity_id: sensor.zendure_total_state_of_charge
        to: "100"

    sensor:
      - name: "Zendure Last Calibration"
        unique_id: zendure_last_calibration
        device_class: timestamp
        icon: mdi:sync
        state: >
          {% if trigger.platform == 'state' %}
            {{ now().isoformat() }}
          {% else %}
            {{ this.state }}
          {% endif %}

  - sensor:
      - name: "Zendure Configuration Version"
        unique_id: zendure_configuration_version
        icon: mdi:one-up
        state: "v20260824"

      - name: "Zendure Last Calibration (Days)"
        unique_id: zendure_last_calibration_days
        unit_of_measurement: "d"
        state: >
         {% set last = states('sensor.zendure_last_calibration') %}
         {% if last in ['unknown','unavailable',''] %}
           0
         {% else %}
         {{ (now().date() - as_datetime(last).date()).days }}
         {% endif %}
        icon: >
         {% if this.state | int(0) < 29 %}
           mdi:thumb-up
         {% else %}
           mdi:thumb-down
         {% endif %}

      - name: "Github Zendure Gielz1986 Releasecheck"
        unique_id: github_zendure_gielz1986_releasecheck
        state: >
          {% set config_date = states('sensor.zendure_configuration_version')
            | regex_findall('v(\d{8})') | first %}
          {% set github_raw = state_attr('sensor.github_zendure_gielz1986', 'tag_name') %}
          {% if github_raw in ['unknown', 'unavailable', None] %}
          {% set github_date = None %}
          {% else %}
          {% set github_date = github_raw | regex_replace('v','') %}
          {% endif %}
          {% if config_date and github_date %}
          {% if config_date > github_date %}
            Pre-release Active
          {% elif config_date < github_date %}
            New Release On GitHub
          {% else %}
            Up-to-date
          {% endif %}
          {% else %}
            Unknown
          {% endif %}
        icon: >
         {% if this.state == 'Up-to-date' %}
          mdi:emoticon-happy-outline
         {% elif this.state == 'New Release On GitHub' %}
          mdi:emoticon-sad-outline
         {% elif this.state == 'Pre-release Active' %}
          mdi:test-tube
         {% else %}
          mdi:emoticon-sad-outline
         {% endif %}

      - name: "Home Energy Meter Target"
        unique_id: home_energy_meter_target
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power
        state: > 
         {{ (states('sensor.home_energy_meter_power') | float(0) + (states('sensor.zendure_power') | float(0) * -1)) | round(0) }}

      - name: "Zendure Relay Switches Today"
        unique_id: zendure_relay_switches_today
        icon: mdi:swap-vertical-bold
        state_class: total_increasing
        state: >
          {% set discharging = states('sensor.zendure_relay_switches_discharging_today') | int(0) %}
          {% set charging = states('sensor.zendure_relay_switches_charging_today') | int(0) %}
          {% set total = discharging + charging - 1 %}
          {{ total if total > 0 else 0 }}

      - name: "Home Energy Meter Power"
        unique_id: home_energy_meter_power
        unit_of_measurement: "W"
        state_class: measurement
        device_class: power
        availability: >
         {% set custom_meter = states('input_text.home_energy_setting_meter_sensor') %}
         {% set custom_meter_valid = custom_meter | lower | regex_match('^sensor\\..+') and states(custom_meter) not in ['unknown', 'unavailable', 'none'] %}
         {% set homewizard_valid = states('sensor.homewizard_p1_power') not in ['unknown', 'unavailable', 'none'] %}
           {{ custom_meter_valid or homewizard_valid }}
        state: >
         {% set custom_meter = states('input_text.home_energy_setting_meter_sensor') %}
         {% if custom_meter | lower | regex_match('^sensor\\..+') and states(custom_meter) not in ['unknown', 'unavailable', 'none'] %}
         {{ states(custom_meter) | float(0) }}
         {% else %}
         {{ states('sensor.homewizard_p1_power') | float(0) }}
         {% endif %}

      - name: "Dynamic Nordpool"
        unique_id: dynamic_nordpool
        icon: mdi:cash
        unit_of_measurement: "€/kWh"
        state: >-
          {% set configured_sensor = states('input_text.dynamic_setting_nordpool_sensor') %}
          {% if configured_sensor | lower | regex_match('^sensor\\..+') and states(configured_sensor) not in ['unknown', 'unavailable', 'none'] %}
            {% set nordpool = configured_sensor %}
          {% else %}
            {% set nordpool = none %}
          {% endif %}

          {% if nordpool is not none %}
            {% set use_15_min = is_state('input_boolean.dynamic_setting_15_minute_interval', 'on') %}
            {% if use_15_min %}
              {% set data = state_attr(nordpool, 'raw_today') or [] %}
              {% set nowts = as_timestamp(now()) %}
              {% set current = namespace(val=None) %}
              {% for p in data %}
                {% set s = as_timestamp(as_datetime(p.start)) %}
                {% set e = as_timestamp(as_datetime(p.end)) %}
                {% if nowts >= s and nowts < e %}
                  {% set current.val = (p.value) | round(5) %}
                {% endif %}
              {% endfor %}
              {{ current.val if current.val is not none else 'unknown' }}
            {% else %}
              {% set raw = state_attr(nordpool, 'raw_today') %}
              {% set current_time = now() %}
              {% if raw %}
                {% set current_hour_values = raw 
                  | selectattr('start', '>=', current_time.replace(minute=0, second=0, microsecond=0))
                  | selectattr('start', '<', current_time.replace(minute=0, second=0, microsecond=0) + timedelta(hours=1))
                  | map(attribute='value') 
                  | list %}
                {% if current_hour_values %}
                  {{ (current_hour_values | sum / current_hour_values | count) | round(5) }}
                {% else %}
                  {{ states(nordpool) }}
                {% endif %}
              {% else %}
                {{ states(nordpool) }}
              {% endif %}
            {% endif %}
          {% else %}
            0
          {% endif %}
        attributes:
          raw_today: >-
            {% set configured_sensor = states('input_text.dynamic_setting_nordpool_sensor') %}
            {% if configured_sensor | lower | regex_match('^sensor\\..+') and states(configured_sensor) not in ['unknown', 'unavailable', 'none'] %}
              {% set nordpool = configured_sensor %}
            {% else %}
              {% set nordpool = none %}
            {% endif %}

            {% if nordpool is not none %}
              {% set use_15_min = is_state('input_boolean.dynamic_setting_15_minute_interval', 'on') %}
              {% set raw = state_attr(nordpool, 'raw_today') %}
              {% if raw %}
                [
                {% if use_15_min %}
                  {% for item in raw %}
                    {
                      "start": "{{ item.start.isoformat() }}",
                      "end": "{{ item.end.isoformat() }}",
                      "value": {{ item.value }}
                    }{% if not loop.last %},{% endif %}
                  {% endfor %}
                {% else %}
                  {% set hourly = raw | groupby('start.hour') %}
                  {% for hour_group in hourly %}
                    {% set values = hour_group.list | map(attribute='value') | list %}
                    {% set hour_start = hour_group.list[0].start.replace(minute=0, second=0, microsecond=0) %}
                    {% set hour_end = hour_start + timedelta(hours=1) %}
                    {
                      "start": "{{ hour_start.isoformat() }}",
                      "end": "{{ hour_end.isoformat() }}",
                      "value": {{ (values | sum / values | count) | round(5) }}
                    }{% if not loop.last %},{% endif %}
                  {% endfor %}
                {% endif %}
                ]
              {% else %}
                []
              {% endif %}
            {% else %}
              []
            {% endif %}
          raw_tomorrow: >-
            {% set configured_sensor = states('input_text.dynamic_setting_nordpool_sensor') %}
            {% if configured_sensor | lower | regex_match('^sensor\\..+') and states(configured_sensor) not in ['unknown', 'unavailable', 'none'] %}
              {% set nordpool = configured_sensor %}
            {% else %}
              {% set nordpool = none %}
            {% endif %}

            {% if nordpool is not none %}
              {% set use_15_min = is_state('input_boolean.dynamic_setting_15_minute_interval', 'on') %}
              {% set raw = state_attr(nordpool, 'raw_tomorrow') %}
              {% if raw %}
                [
                {% if use_15_min %}
                  {% for item in raw %}
                    {
                      "start": "{{ item.start.isoformat() }}",
                      "end": "{{ item.end.isoformat() }}",
                      "value": {{ item.value }}
                    }{% if not loop.last %},{% endif %}
                  {% endfor %}
                {% else %}
                  {% set hourly = raw | groupby('start.hour') %}
                  {% for hour_group in hourly %}
                    {% set values = hour_group.list | map(attribute='value') | list %}
                    {% set hour_start = hour_group.list[0].start.replace(minute=0, second=0, microsecond=0) %}
                    {% set hour_end = hour_start + timedelta(hours=1) %}
                    {
                      "start": "{{ hour_start.isoformat() }}",
                      "end": "{{ hour_end.isoformat() }}",
                      "value": {{ (values | sum / values | count) | round(5) }}
                    }{% if not loop.last %},{% endif %}
                  {% endfor %}
                {% endif %}
                ]
              {% else %}
                []
              {% endif %}
            {% else %}
              []
            {% endif %}
          max_tomorrow: >-
            {% set data = state_attr('sensor.dynamic_nordpool','raw_tomorrow') %}
            {% if data %}
            {{ data | map(attribute='value') | max | round(5) }}
            {% else %}
              0
            {% endif %}
          min_tomorrow: >-
            {% set data = state_attr('sensor.dynamic_nordpool','raw_tomorrow') %}
            {% if data %}
            {{ data | map(attribute='value') | min | round(5) }}
            {% else %}
              0
            {% endif %}
          max_today: >-
            {% set data = state_attr('sensor.dynamic_nordpool','raw_today') %}
            {% if data %}
            {{ data | map(attribute='value') | max | round(5) }}
            {% else %}
              0
            {% endif %}
          min_today: >-
            {% set data = state_attr('sensor.dynamic_nordpool','raw_today') %}
            {% if data %}
            {{ data | map(attribute='value') | min | round(5) }}
            {% else %}
              0
            {% endif %}

      - name: "Dynamic Spread Indication"
        unique_id: dynamic_spread_indication
        icon: mdi:percent-box
        unit_of_measurement: "%"
        state: >
          {% set hours = state_attr('sensor.dynamic_lowest_price_period', 'raw_today') or [] %}
          {% set correction = states('input_number.dynamic_export_correction') | float(0) %}
          {% set cheap = hours | selectattr('goedkoop','equalto','Yes') | list %}
          {% set expensive = hours | selectattr('duur','equalto','Yes') | list %}
          {% if cheap | count > 0 and expensive | count > 0 %}
            {% set avg_cheap = cheap | map(attribute='value') | sum / cheap | count %}
            {% set avg_expensive = (expensive | map(attribute='value') | sum / expensive | count) - correction %}
            {{ ((avg_expensive - avg_cheap) / (avg_cheap | abs) * 100) | round(1) }}
          {% else %}
            0
          {% endif %}
        attributes:
          manual_periods: >
            {% if states('input_text.dynamic_manual_period') | length > 0 %}
              N/A
            {% else %}
              {% set hours = state_attr('sensor.dynamic_lowest_price_period', 'raw_today') or [] %}
              {% set ns = namespace(result=[]) %}
              {% for hour in hours %}
                {% if hour.goedkoop == 'Yes' %}
                  {% set ns.result = ns.result + ['G' ~ (hour.start | as_datetime).strftime('%H:%M')] %}
                {% elif hour.duur == 'Yes' %}
                  {% set ns.result = ns.result + ['D' ~ (hour.start | as_datetime).strftime('%H:%M')] %}
                {% endif %}
              {% endfor %}
              {{ ns.result | join(';') }}
            {% endif %}
          lowest_price_periods: >
            {% set hours = state_attr('sensor.dynamic_lowest_price_period', 'raw_today') or [] %}
            {% set cheap = hours | selectattr('goedkoop','equalto','Yes') | sort(attribute='start') | list %}
            [
            {% for hour in cheap %}
              "{{ (hour.start | as_datetime).strftime('%H:%M') }} - €{{ '%.4f' | format(hour.value) }}"
              {% if not loop.last %}, {% endif %}
            {% endfor %}
            ]
          highest_price_periods: >
            {% set hours = state_attr('sensor.dynamic_lowest_price_period', 'raw_today') or [] %}
            {% set correction = states('input_number.dynamic_export_correction') | float(0) %}
            {% set expensive = hours | selectattr('duur','equalto','Yes') | sort(attribute='start') | list %}
            [
            {% for hour in expensive %}
              "{{ (hour.start | as_datetime).strftime('%H:%M') }} - €{{ '%.4f' | format(hour.value - correction) }}"
              {% if not loop.last %}, {% endif %}
            {% endfor %}
            ]
          average_lowest_price: >
            {% set hours = state_attr('sensor.dynamic_lowest_price_period', 'raw_today') or [] %}
            {% set cheap = hours | selectattr('goedkoop','equalto','Yes') | list %}
            {% if cheap | count > 0 %}
              €{{ '%.4f' % (cheap | map(attribute='value') | sum / cheap | count) }}
            {% else %}
              N/A
            {% endif %}
          average_highest_price: >
            {% set hours = state_attr('sensor.dynamic_lowest_price_period', 'raw_today') or [] %}
            {% set correction = states('input_number.dynamic_export_correction') | float(0) %}
            {% set expensive = hours | selectattr('duur','equalto','Yes') | list %}
            {% if expensive | count > 0 %}
              €{{ '%.4f' % ((expensive | map(attribute='value') | sum / expensive | count) - correction) }}
            {% else %}
              N/A
            {% endif %}
          difference_in_value: >
            {% set hours = state_attr('sensor.dynamic_lowest_price_period', 'raw_today') or [] %}
            {% set correction = states('input_number.dynamic_export_correction') | float(0) %}
            {% set cheap = hours | selectattr('goedkoop','equalto','Yes') | list %}
            {% set expensive = hours | selectattr('duur','equalto','Yes') | list %}
            {% if cheap | count > 0 and expensive | count > 0 %}
              {% set avg_cheap = cheap | map(attribute='value') | sum / cheap | count %}
              {% set avg_expensive = (expensive | map(attribute='value') | sum / expensive | count) - correction %}
              €{{ '%.4f' % (avg_expensive - avg_cheap) }}
            {% else %}
              N/A
            {% endif %}

      - name: "Dynamic Spread Indication DSC"
        unique_id: dynamic_spread_indication_dsc
        icon: mdi:percent-box
        unit_of_measurement: "%"
        state: >
          {% set hours = state_attr('sensor.dynamic_lowest_price_period', 'raw_today') or [] %}
          {% set most_expensive = state_attr('sensor.dynamic_lowest_price_period', 'duurste_na_eerste_goedkope') or [] %}

          {% set cheap_hours = hours | selectattr('goedkoop','equalto','Yes') | list %}
          {% set expensive_hours = most_expensive | list %}

