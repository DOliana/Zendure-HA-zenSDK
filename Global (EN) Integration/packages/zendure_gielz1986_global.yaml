         {% set charge = states('sensor.zendure_total_state_of_charge') | float(0) %}
         {% set max_charge = states('sensor.zendure_maximum_state_of_charge') | float(100) %}
         {% if power > 0 %}
          {% set charge_power_kw = power / 1000 %}
          {% if charge_power_kw > 0 and remaining_energy > 0 %}
         {% set hours = remaining_energy / charge_power_kw %}
         {% set total_minutes = (hours * 60) | int %}
         {% set hours = total_minutes // 60 %}
         {% set minutes = total_minutes % 60 %}
         {{ hours }}h {{ minutes }}m
         {% else %}
          Unknown
         {% endif %}
         {% else %}
          Not Charging
          {% endif %}
        icon: mdi:clock-time-four-outline
