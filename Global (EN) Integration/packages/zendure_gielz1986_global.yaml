rest_command:
  zendure_save_in_ram:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"smartMode": 1 }}'

  zendure_quick_charge:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"acMode": 1, "inputLimit": {{inputLimit}} }}'

  zendure_stop_with_charging:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"acMode": 1, "inputLimit": 0 }}'

  zendure_x_charge:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn": "{{sn}}","properties": {"acMode": 1, "inputLimit": {{inputLimit}} }}'

  zendure_x_charge_balancing:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"inputLimit": {{inputLimit}} }}'

  zendure_x_discharge:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"acMode": 2, "outputLimit": {{outputLimit}} }}'

  zendure_x_discharge_balancing:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"outputLimit": {{outputLimit}} }}'

  zendure_quick_discharge:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"acMode": 2, "outputLimit": {{outputLimit}} }}'

  zendure_stop_with_discharging:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"acMode": 2, "outputLimit": 0 }}'

  zendure_stop_with_everything:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"outputLimit": 0, "inputLimit": 0 }}'

  zendure_full_standby:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"smartMode": 0, "outputLimit": 0, "inputLimit": 0 }}'
    
  zendure_setting:
    url: http://{{ states('input_text.zendure_setting_ip_address') }}/properties/write
    method: POST
    headers:
      Content-Type: application/json
      Content-Encoding: identity
    payload: '{"sn":"{{sn}}","properties":{"{{setting_item}}": {{setting_value}} }}'
