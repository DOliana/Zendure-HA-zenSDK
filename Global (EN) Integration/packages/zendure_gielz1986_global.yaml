         {% if power < 0 %}
         {% set discharge_power_kw = (power | abs) / 1000 %}
         {% if discharge_power_kw > 0 %}
           {% set hours = remaining_energy / discharge_power_kw %}
           {% set total_minutes = (hours * 60) | int %}
           {% set hours = total_minutes // 60 %}
           {% set minutes = total_minutes % 60 %}
           {{ hours }}h {{ minutes }}m
         {% else %}
           Unknown
         {% endif %}
         {% else %}
           Not Discharging
         {% endif %}
        icon: mdi:clock-time-eight-outline
        unique_id: zendure_indication_remaining_discharge_time

      - name: "Zendure Indication Remaining Charge Time"
