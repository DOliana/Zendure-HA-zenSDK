                  "duur": "{{ 'Yes' if hour.start in ns.expensive_start_times else 'No' }}"
                }{% if not loop.last %},{% endif %}
              {% endfor %}
              ]
            {% else %}
              []
            {% endif %}
          duurste_na_eerste_goedkope: >
            {% set prices = state_attr('sensor.dynamic_lowest_price_period','raw_today') or [] %}
            {% set cheap_periods = prices
              | selectattr('goedkoop','eq','Yes')
              | map(attribute='start')
              | map('as_datetime')
              | select('!=', None)
              | sort
              | list %}
            {% set first_cheap = cheap_periods | first if cheap_periods else none %}
            {% if prices and first_cheap %}
              [
              {% for hour in prices
                if hour.duur == 'Yes'
                and (hour.start | as_datetime > first_cheap)
              %}
                {
                  "start": "{{ hour.start }}",
                  "end": "{{ hour.end }}",
                  "value": {{ hour.value }},
                  "goedkoop": "{{ hour.goedkoop }}",
                  "duur": "Yes"
                }{% if not loop.last %},{% endif %}
              {% endfor %}
              ]
            {% else %}
              []
            {% endif %}

          duurste_na_eerste_goedkope_tomorrow: >
            {% set prices = state_attr('sensor.dynamic_lowest_price_period','raw_tomorrow') or [] %}
            {% set cheap_periods = prices
              | selectattr('goedkoop','eq','Yes')
              | map(attribute='start')
              | map('as_datetime')
              | select('!=', None)
              | sort
              | list %}
            {% set first_cheap = cheap_periods | first if cheap_periods else none %}
            {% if prices and first_cheap %}
              [
              {% for hour in prices
                if hour.duur == 'Yes'
                and (hour.start | as_datetime > first_cheap)
              %}
                {
                  "start": "{{ hour.start }}",
                  "end": "{{ hour.end }}",
                  "value": {{ hour.value }},
                  "goedkoop": "{{ hour.goedkoop }}",
                  "duur": "Yes"
                }{% if not loop.last %},{% endif %}
              {% endfor %}
              ]
            {% else %}
              []
            {% endif %}

      - name: "Zendure Export Efficiency"
        unique_id: zendure_export_efficiency
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:percent-box
        state: >
          {% set ac = states('sensor.zendure_power_export') | float(0) %}
          {% set dc = states('sensor.zendure_power_export_dc') | float(0) %}
          {% if ac > 0 and dc > 0 %}
            {% set efficiency = (ac / dc) * 100 %}
            {{ [0, [efficiency, 100] | min] | max | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Zendure Import Efficiency"
        unique_id: zendure_import_efficiency
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:percent-box
        state: >
          {% set ac = states('sensor.zendure_power_import') | float(0) %}
          {% set dc = states('sensor.zendure_power_import_dc') | float(0) %}
          {% if ac > 0 and dc > 0 %}
            {% set efficiency = (dc / ac) * 100 %}
            {{ [0, [efficiency, 100] | min] | max | round(1) }}
          {% else %}
            0
          {% endif %}

      - name: "Zendure Indication Available Energy"
        unique_id: zendure_indication_available_energy
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:lightning-bolt-circle
        state: >
          {% set charge = states('sensor.zendure_total_state_of_charge') | float(0) %}
          {% set min_charge = states('sensor.zendure_minimum_state_of_charge') | float(0) %}
          {% set max_charge = states('sensor.zendure_maximum_state_of_charge') | float(100) %}
          {% set total_capacity = states('sensor.zendure_total_capacity') | float(0) %}

          {% set export_eff = states('sensor.zendure_export_efficiency_24h') | float(0) %}
          {% set total_rte = states('sensor.zendure_rte_total') | float(0) %}

          {% set effective_charge = [charge, max_charge] | min %}
          {% set rte_export_equivalent = (total_rte / 100) ** 0.5 * 100 %}

          {% if export_eff < 70 %}
            {% set effective_efficiency = rte_export_equivalent %}
          {% else %}
            {% set effective_efficiency = export_eff %}
          {% endif %}

          {% set effective_efficiency = [effective_efficiency, 100] | min / 100 %}
          {% set usable_percentage = effective_charge - min_charge %}

          {% if usable_percentage <= 0 %}
            0
          {% else %}
            {{ (usable_percentage / 100 * total_capacity * effective_efficiency) | round(2) }}
          {% endif %}
        attributes:
          total_capacity_kwh: >
            {{ states('sensor.zendure_total_capacity') }}
          indication_available_energy_(without_loss): >
            {% set charge = states('sensor.zendure_total_state_of_charge') | float(0) %}
            {% set min_charge = states('sensor.zendure_minimum_state_of_charge') | float(0) %}
            {% set max_charge = states('sensor.zendure_maximum_state_of_charge') | float(100) %}
            {% set total_capacity = states('sensor.zendure_total_capacity') | float(0) %}

            {% set effective_charge = [charge, max_charge] | min %}
            {% set usable_percentage = effective_charge - min_charge %}

            {% if usable_percentage <= 0 %}
              0
            {% else %}
              {{ (usable_percentage / 100 * total_capacity) | round(2) }}
            {% endif %}
          usable_percentage: >
            {% set charge = states('sensor.zendure_total_state_of_charge') | float(0) %}
            {% set min_charge = states('sensor.zendure_minimum_state_of_charge') | float(0) %}
            {% set max_charge = states('sensor.zendure_maximum_state_of_charge') | float(100) %}
            {{ ([charge, max_charge] | min - min_charge) | round(1) }} %
          used_export_efficiency: >
            {% set export_eff = states('sensor.zendure_export_efficiency_24h') | float(0) %}
            {% set total_rte = states('sensor.zendure_rte_total') | float(0) %}
            {% set rte_export_equivalent = (total_rte / 100) ** 0.5 * 100 %}
            {% if export_eff < 70 %}
              {{ rte_export_equivalent | round(1) }} %
            {% else %}
              {{ export_eff | round(1) }} %
            {% endif %}
          source_export_efficiency: >
            {% set export_eff = states('sensor.zendure_export_efficiency_24h') | float(0) %}
            {% if export_eff < 70 %}
              RTE total (√RTE × 100)
            {% else %}
              Export efficiency 24h average
            {% endif %}

      - name: "Zendure Indication Required Energy"
        unique_id: zendure_indication_required_energy
        unit_of_measurement: "kWh"
        device_class: energy
        icon: mdi:lightning-bolt-circle
        state: >
          {% set charge = states('sensor.zendure_total_state_of_charge') | float(0) %}
          {% set max_charge = states('sensor.zendure_maximum_state_of_charge') | float(100) %}
          {% set total_capacity = states('sensor.zendure_total_capacity') | float(0) %}
          {% set import_eff = states('sensor.zendure_import_efficiency_24h') | float(0) %}
          {% set total_rte = states('sensor.zendure_rte_total') | float(0) %}
          {% set effective_charge = [charge, max_charge] | min %}
          {% set rte_import_equivalent = (total_rte / 100) ** 0.5 * 100 %}
          {% if import_eff < 70 %}
            {% set effective_efficiency = rte_import_equivalent %}
          {% else %}
            {% set effective_efficiency = import_eff %}
          {% endif %}
          {% set effective_efficiency = [effective_efficiency, 100] | min / 100 %}
          {% set required_percentage = max_charge - effective_charge %}
          {% if required_percentage <= 0 %}
            0
          {% elif effective_efficiency <= 0 %}
            {{ none }}
          {% else %}
            {{ (required_percentage / 100 * total_capacity / effective_efficiency) | round(2) }}
          {% endif %}
        attributes:
          total_capacity_kwh: >
            {{ states('sensor.zendure_total_capacity') }}
          indication_required_energy_(without_loss): >
            {% set charge = states('sensor.zendure_total_state_of_charge') | float(0) %}
            {% set max_charge = states('sensor.zendure_maximum_state_of_charge') | float(100) %}
            {% set total_capacity = states('sensor.zendure_total_capacity') | float(0) %}
            {% set effective_charge = [charge, max_charge] | min %}
            {% set required_percentage = max_charge - effective_charge %}
            {% if required_percentage <= 0 %}
              0
            {% else %}
              {{ (required_percentage / 100 * total_capacity) | round(2) }}
            {% endif %}
          required_percentage: >
            {% set charge = states('sensor.zendure_total_state_of_charge') | float(0) %}
            {% set max_charge = states('sensor.zendure_maximum_state_of_charge') | float(100) %}
            {{ ([max_charge - [charge, max_charge] | min, 0] | max) | round(1) }} %
          used_import_efficiency: >
            {% set import_eff = states('sensor.zendure_import_efficiency_24h') | float(0) %}
            {% set total_rte = states('sensor.zendure_rte_total') | float(0) %}
            {% set rte_import_equivalent = (total_rte / 100) ** 0.5 * 100 %}
            {% if import_eff >= 70 %}
              {{ import_eff | round(1) }} %
            {% elif rte_import_equivalent > 0 %}
              {{ rte_import_equivalent | round(1) }} %
            {% else %}
              Unknown
            {% endif %}
          source_import_efficiency: >
            {% set import_eff = states('sensor.zendure_import_efficiency_24h') | float(0) %}
            {% set total_rte = states('sensor.zendure_rte_total') | float(0) %}

            {% if import_eff >= 70 %}
              Import efficiency 24h average
            {% elif total_rte > 0 %}
              RTE total (√RTE × 100)
            {% else %}
              No valid efficiency data yet
            {% endif %}

      - name: "Zendure RTE Total"
        unique_id: zendure_rte_total
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:percent-box
        state: >
          {% set energy_import = states('sensor.zendure_energy_import') | float(0) %}
          {% set energy_export = states('sensor.zendure_energy_export') | float(0) %}
          {% if energy_import > 0 %}
            {% set percentage = ((energy_export / energy_import) * 100) | round(2) %}
            {% if 0 <= percentage <= 100 %}
              {{ percentage }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}

