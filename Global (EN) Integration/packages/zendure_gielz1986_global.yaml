      - name: "Zendure Power"
        value_template: >
          {% set pv = value_json['properties']['pvStatus'] | int(0) %}
          {% set solar = value_json['properties']['solarInputPower'] | float(0) %}
          {% set grid_off = value_json.get('properties', {}).get('gridOffPower', 0) | float(0) %}
          {% set pv_active = (pv == 1) or (solar > 0) or (grid_off < 0) %}
          {% set pass = value_json['properties']['pass'] | int %}
          {% set ac_mode = value_json['properties']['acMode'] | int %}
          {% if not pv_active %}
            {% set charging = value_json['properties']['outputPackPower'] | float(0) %}
            {% set discharging = - (value_json['properties']['packInputPower'] | float(0)) %}
            {{ charging if charging != 0 else discharging }}
          {% else %}
            {% set charging = value_json['properties']['gridInputPower'] | float(0) %}
            {% set full_charging = value_json['properties']['outputPackPower'] | float(0) %}
            {% set discharging = - (value_json['properties']['outputHomePower'] | float(0)) %}
            {% if pass == 2 %}
              {% set result = full_charging %}
            {% elif charging != 0 %}
              {% set result = charging %}
            {% else %}
              {% set result = discharging %}
            {% endif %}
            {% if ac_mode == 1 and result < 0 %}
              0
            {% else %}
              {{ result }}
            {% endif %}
          {% endif %}
        unique_id: zendure_power
