      - name: "Dynamic Highest Price Period"
        unique_id: dynamic_highest_price_period
        icon: mdi:progress-clock
        state: >
          {% set prices = state_attr('sensor.dynamic_nordpool', 'raw_today') %}
          {% set manual_periods = states('input_text.dynamic_manual_period') %}
          {% set expensive_count = states('input_number.dynamic_highest_price_x_period') | int %}
          {% set quarter_hour = is_state('input_boolean.dynamic_setting_15_minute_interval', 'on') %}
          {% set default_delta = timedelta(minutes=15) if quarter_hour else timedelta(hours=1) %}
          {% if prices is iterable %}
            {% set ns = namespace(expensive_start_times=[]) %}
            {% if manual_periods | length > 0 %}
              {% for item in manual_periods.split(';') %}
                {% if item[0] == 'D' %}
                  {% set times = item[1:] %}
                  {% if '-' in times %}
                    {% set start_str = times.split('-')[0] %}
                    {% set end_string = times.split('-')[1] %}
                    {% set range_block = True %}
                  {% else %}
                    {% set start_str = times %}
                    {% set range_block = False %}
                  {% endif %}
                  {% for hour in prices %}
                    {% set dt_start = hour.start | as_datetime %}
                    {% set dt_end = hour.end | as_datetime %}
                    {% set day = dt_start.strftime('%Y-%m-%d') %}
                    {% set tz = dt_start.tzinfo %}
                    {% set start_dt = strptime(day ~ ' ' ~ start_str, '%Y-%m-%d %H:%M').replace(tzinfo=tz) %}
                    {% if range_block %}
                      {% set end_datetime = strptime(day ~ ' ' ~ end_string, '%Y-%m-%d %H:%M').replace(tzinfo=tz) %}
                      {% if end_datetime <= start_dt %}
                        {% set end_datetime = end_datetime + timedelta(days=1) %}
                      {% endif %}
                      {% set end_datetime = end_datetime + timedelta(seconds=1) %}
                    {% else %}
                      {% set end_datetime = start_dt + default_delta %}
                    {% endif %}
                    {% if dt_start < end_datetime and dt_end > start_dt %}
                      {% set ns.expensive_start_times = ns.expensive_start_times + [hour.start] %}
                    {% endif %}
                  {% endfor %}
                {% endif %}
              {% endfor %}
            {% else %}
              {% set sorted_prices = prices | sort(attribute='value') %}
              {% if expensive_count > 0 %}
                {% set ns.expensive_start_times = sorted_prices[-expensive_count:] | map(attribute='start') | list %}
              {% else %}
                {% set ns.expensive_start_times = [] %}
              {% endif %}
            {% endif %}
            {% set current_time = now().astimezone() %}
            {% set active = prices
              | selectattr('start', 'in', ns.expensive_start_times)
              | selectattr('start', 'le', current_time.isoformat())
              | selectattr('end', 'gt', current_time.isoformat())
              | list %}
            {{ 'Yes' if active | length > 0 else 'No' }}
          {% else %}
            Unknown
          {% endif %}
        attributes:
          raw_today: >
            {% set prices = state_attr('sensor.dynamic_lowest_price_period', 'raw_today') %}
            {% set manual_periods = states('input_text.dynamic_manual_period') %}
            {% set cheap_count = states('input_number.dynamic_lowest_price_x_period') | int %}
            {% set expensive_count = states('input_number.dynamic_highest_price_x_period') | int %}
            {% if prices is iterable %}
              {% set ns = namespace(cheap_start_times=[], expensive_start_times=[]) %}
              {% if manual_periods | length > 0 %}
                {% for item in manual_periods.split(';') %}
                  {% set type = item[0] %}
                  {% set times = item[1:] %}
                  {% for hour in prices %}
                    {% if hour.start[11:16] == times %}
                      {% if type == 'G' %}
                        {% set ns.cheap_start_times = ns.cheap_start_times + [hour.start] %}
                      {% elif type == 'D' %}
                        {% set ns.expensive_start_times = ns.expensive_start_times + [hour.start] %}
                      {% endif %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
              {% else %}
                {% set sorted_prices = prices | sort(attribute='value') %}
                {% set ns.cheap_start_times = sorted_prices[:cheap_count] | map(attribute='start') | list %}
                {% if expensive_count > 0 %}
                  {% set ns.expensive_start_times = sorted_prices[-expensive_count:] | map(attribute='start') | list %}
                {% else %}
                  {% set ns.expensive_start_times = [] %}
                {% endif %}
              {% endif %}
              [
              {% for hour in prices %}
                {
                  "start": "{{ hour.start }}",
                  "end": "{{ hour.end }}",
                  "value": {{ hour.value }},
                  "goedkoop": "{{ 'Yes' if hour.start in ns.cheap_start_times else 'No' }}",
                  "duur": "{{ 'Yes' if hour.start in ns.expensive_start_times else 'No' }}"
                }{% if not loop.last %},{% endif %}
              {% endfor %}
              ]
            {% else %}
              []
            {% endif %}

